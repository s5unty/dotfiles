[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = "O"
run = '''shell --block --
set -- %s

if [ "$#" -eq 2 ]; then
    exec vi -d -- "$@"
fi

case %h in
    *.[mM][dD]|*.[mM][aA][rR][kK][dD][oO][wW][nN])
        nohup x-www-browser %h </dev/null >/dev/null 2>&1 &
        ;;
    *)
        ya emit open --interactive
        ;;
esac
'''
desc = "Diff two files / Markdown in browser / Open with"

[[mgr.prepend_keymap]]
on = [ "m", "S" ]
run  = "plugin what-size -- '--clipboard'"
desc = "Calc size of selection or cwd"

[[mgr.prepend_keymap]]
on = [ "M" ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "`" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "m", "d" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "m", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

